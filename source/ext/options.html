<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LeadChat → Заявка: настройки</title>
<style>
:root{color-scheme:dark;--bg:#0b0e0d;--surface:#141b18;--field:#0b0e0d;--line:#2a332e;--text:#e7ede9;--muted:#a1ada5;--accent:#3cc13b;--on-accent:#04160a;--danger:#ff9ea1;--warning:#d9a94e;--warn-bg:#241a05;--bad-bg:#2a1213}
*{box-sizing:border-box}body{font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);max-width:720px;margin:32px auto;padding:0 24px 40px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1{font-size:22px;line-height:1.3;margin:0 0 6px;letter-spacing:-.025em;font-weight:650}h2{font-size:14px;line-height:1.4;margin:0 0 8px;font-weight:650}p{margin:8px 0;overflow-wrap:anywhere}.intro{margin:0 0 24px;color:var(--muted);font-size:12.5px}
.card{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:20px 0;margin:0}.card:last-of-type{border-bottom:1px solid var(--line)}
label{display:block;margin:16px 0 6px;font-size:12px;font-weight:600;color:var(--text)}input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--text);font:inherit}input{min-height:44px}textarea{min-height:220px;resize:vertical;font:12px/1.6 ui-monospace,"SF Mono",Menlo,monospace}input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}input:hover,textarea:hover{border-color:var(--muted)}
.muted{color:var(--muted);font-size:12.5px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
button{min-height:44px;padding:9px 14px;border:1px solid transparent;border-radius:7px;background:var(--accent);color:var(--on-accent);font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer;white-space:normal;overflow-wrap:anywhere;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease}
button:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 86%,white)}button:active:not(:disabled){filter:brightness(.94)}button.grey,button.danger{background:transparent;border-color:var(--line);color:var(--text)}button.grey:hover:not(:disabled){background:var(--surface);border-color:var(--muted)}button.danger{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}button.danger:hover:not(:disabled){background:var(--bad-bg);border-color:var(--danger)}button:disabled{opacity:.55;cursor:not-allowed;filter:none}
:is(button,input,textarea,summary,a):focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#st,#srcSt{display:block;font-size:12.5px;color:var(--accent);margin-top:10px;min-height:20px;overflow-wrap:anywhere}#st.bad,#srcSt.bad{color:var(--danger)}
.box{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-left-width:3px;border-radius:7px;font-size:12.5px;line-height:1.6;overflow-wrap:anywhere;background:var(--surface)}.box:empty{display:none}
.box.warn{border-color:color-mix(in srgb,var(--warning) 55%,var(--line));border-left-color:var(--warning);background:var(--warn-bg)}.box.bad{border-color:color-mix(in srgb,var(--danger) 55%,var(--line));border-left-color:var(--danger);background:var(--bad-bg)}
.box .mk{display:inline-block;width:1.4em;font-weight:700}.box .mk.ok{color:var(--accent)}.box .mk.no{color:var(--danger)}.box .mk.wait{color:var(--muted)}
.box .hint{color:var(--muted);margin-left:1.4em;font-size:12px}.box details{margin-top:6px}.box summary{cursor:pointer;color:var(--muted)}
a{color:var(--accent);text-underline-offset:3px}summary{cursor:pointer;font-weight:600;min-height:40px;line-height:1.5;padding-block:8px;overflow-wrap:anywhere}details.card{padding:4px 0}details.card>summary{font-size:13px;min-height:48px;padding:14px 4px;border-radius:6px}details.card>summary:hover{background:var(--surface)}details.card[open]{padding-bottom:20px}details.card[open]>summary{margin-bottom:8px;color:var(--text)}
@media(max-width:480px){body{margin:20px auto;padding:0 16px 32px}h1{font-size:20px}.intro{margin-bottom:20px}.card{padding:16px 0}.actions button{flex:1 1 140px}.actions #logout{flex:0 1 auto}}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#fafcfb;--surface:#f0f4f1;--field:#fff;--line:#d6e0d9;--text:#17271d;--muted:#52685b;--accent:#237b25;--on-accent:#fff;--danger:#b42335;--warning:#8e6515;--warn-bg:#fff8e8;--bad-bg:#fff0f0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<h1>Настройки</h1>
<p class="intro">LeadChat → CRM</p>
<section class="card" aria-labelledby="connection-title">
<h2 id="connection-title">Подключение</h2>
<p class="muted">Мозг · Telegram · CRM</p>
<div id="health" class="box" role="status" aria-live="polite"></div>
<p class="muted">Токен сохранён? Оставьте поле пустым для проверки.</p>
<label for="tok">Токен</label><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="вставьте токен">
<div class="actions"><button id="check">Проверить и сохранить</button><button id="logout" class="grey">Выйти</button></div><span id="st" role="status" aria-live="polite"></span>
<div id="state" class="box"></div>
</section>
<details class="card"><summary>Источники и отзывы</summary>
<p class="muted">Список из Telegram целиком. Пусто — встроенный.</p>
<p class="muted" id="srcInfo"></p>
<label for="sources">Список источников</label><textarea id="sources" spellcheck="false"></textarea>
<div class="actions"><button id="saveSrc">Сохранить</button></div><span id="srcSt" role="status" aria-live="polite"></span>
</details>
<details class="card"><summary>Дополнительно</summary>
<h2>Отметки созданных заявок</h2><p class="muted" id="cnt"></p>
<p class="muted">Сбросит только отметки. Заявки в CRM сохранятся.</p>
<div class="actions"><button id="clr" class="danger">Сбросить отметки</button></div>
</details>
<script src="config.js"></script>
<script src="links.js"></script>
<script src="options.js"></script>
</body></html>
